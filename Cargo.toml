[package]
name = "ghostline-character-builder"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Standalone Cyberpunk 2077 character authoring"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
ghostline-red = { path = "../ghostline-red" }
ghostline-renderer = { path = "../renderer" }
ghostline-refitter = { path = "../refitter" }
glam = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pollster = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
debug = 1
